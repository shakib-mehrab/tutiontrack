<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · TuitionTrack</title>
  <style>
    :root { --bg: #f6f7fb; --fg: #0f172a; --muted: #64748b; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --fg: #e2e8f0; --muted: #94a3b8; --accent: #818cf8; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); text-align: center; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; max-width: 32ch; line-height: 1.5; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 20px; background: var(--accent); color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.1a5 5 0 0 1 7 0M12 20h.01M3 3l18 18" />
    </svg>
    <h1>You're offline</h1>
    <p>TuitionTrack needs a connection to load your classes. Check your internet and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
